name: Runner status

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-status

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read runners of the benchmark repo
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN }}
        run: |
          mkdir status
          gh api repos/Azzinoth/FocalEngineBenchmark/actions/runners --jq '{
            checked_at: (now | todate),
            runners: ([.runners[] | {name, status, busy, labels: [.labels[].name]}] | sort_by(.name))
          }' > status/runners.json
          cat status/runners.json

      # Force-pushed as a single commit to its own branch, so it doesn't grow history or rebuild Pages.
      - name: Push to status branch
        working-directory: status
        run: |
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runners.json
          git commit -q -m "Runner status"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
